<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I'm Sorry</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="petals" aria-hidden="true"></div>

      <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle music" hidden>🔇</button>

      <section class="card">
        <!-- 1. Intro -->
        <section id="intro" class="screen active" aria-labelledby="introTitle">
          <div class="face" id="introFace" aria-hidden="true">(╥﹏╥)</div>
          <h1 id="introTitle">I'm sorry, <span id="herName">love</span></h1>
          <p class="subtitle">I made this page because I wanted to say it properly.</p>
          <button id="startBtn" class="btn primary" type="button">Please listen 🥺</button>
        </section>

        <!-- 2. Reasons -->
        <section id="reasons" class="screen" aria-labelledby="reasonsTitle">
          <h2 id="reasonsTitle">What I'm sorry for 💔</h2>
          <p class="subtitle">Tap each one.</p>
          <div id="reasonList" class="reason-list"></div>
          <p id="reasonText" class="reason-text" aria-live="polite"></p>
          <button id="toPromisesBtn" class="btn primary" type="button" disabled>Next</button>
        </section>

        <!-- 3. Promises -->
        <section id="promises" class="screen" aria-labelledby="promisesTitle">
          <h2 id="promisesTitle">My promises 🤞</h2>
          <p class="subtitle">Tick each one to make it official.</p>
          <ul id="promiseList" class="promise-list"></ul>
          <button id="toForgiveBtn" class="btn primary" type="button" disabled>Next</button>
        </section>

        <!-- 4. Forgive -->
        <section id="forgive" class="screen" aria-labelledby="forgiveTitle">
          <div class="face" id="forgiveFace" aria-hidden="true">(｡•́︿•̀｡)</div>
          <h2 id="forgiveTitle">Can you forgive me? 🥹</h2>
          <div class="buttons forgive-actions" id="forgiveActions">
            <button id="yesBtn" class="btn primary" type="button">Yes, I forgive you 💗</button>
            <button id="noBtn" class="btn ghost" type="button">Not yet</button>
          </div>
          <p id="forgiveMessage" class="message" aria-live="polite"></p>
        </section>

        <!-- 5. Final -->
        <section id="final" class="screen" aria-labelledby="finalTitle">
          <h2 id="finalTitle">Thank you 💌</h2>
          <div class="letter">
            <p id="letterText"></p>
            <div class="letter-heart" aria-hidden="true">❤</div>
          </div>
        </section>
      </section>
    </main>

    <footer class="footer">Made with ❤️ by Kushal</footer>

    <audio id="bgMusic" preload="auto" loop></audio>
    <script src="script.js"></script>
  </body>
</html>
